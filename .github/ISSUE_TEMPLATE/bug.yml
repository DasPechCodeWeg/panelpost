name: Something doesn't work
description: A dashboard doesn't render correctly, a report fails, or delivery doesn't arrive.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: This issue is public. Leave out internal hostnames, tokens and screenshots of confidential data.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected, and what you got instead. The error message from the run page helps most.
    validations:
      required: true
  - type: input
    id: grafana
    attributes:
      label: Grafana version
      description: Shown on the Grafana tab in Panelpost, for example "13.2.2 (Open Source)".
    validations:
      required: true
  - type: input
    id: panelpost
    attributes:
      label: Panelpost version
      description: Shown at the bottom of every page.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run Panelpost?
      options: ["Docker", "Docker Compose", "Kubernetes", "Binary (Linux)", "Binary (macOS)", "Binary (Windows)", "Other"]
  - type: textarea
    id: logs
    attributes:
      label: Log output
      description: "For Docker: `docker logs panelpost --since 30m`. Remove anything confidential."
      render: text
